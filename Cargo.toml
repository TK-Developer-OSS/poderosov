[workspace]
resolver = "3"
members = ["crates/poderosov-core", "src-tauri"]

[workspace.package]
version = "5.0.0"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
tokio = "1.47"

# An unoptimised build of the crypto crates makes the SSH handshake take
# seconds, so dependencies are optimised even in debug builds.
[profile.dev.package."*"]
opt-level = 2
