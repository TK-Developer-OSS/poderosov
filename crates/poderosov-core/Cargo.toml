[package]
name = "poderosov-core"
description = "Session and protocol layer of PoderosoV, independent of the GUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bytes = "1.7"
encoding_rs = "0.8"
quick-xml = "0.42"
# `ring` rather than the default aws-lc-rs backend: it needs nothing but a C compiler to build.
russh = { version = "0.63.3", default-features = false, features = ["flate2", "ring", "rsa"] }
thiserror = "2"
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
