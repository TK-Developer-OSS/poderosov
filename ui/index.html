<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>PoderosoV</title>
    <link rel="stylesheet" href="vendor/xterm/xterm.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="toolbar">
      <button type="button" id="new-connection" title="新規Telnet/SSH接続 (Alt+N)">新規接続...</button>
      <button type="button" id="xmodem-send" title="相手側で rx などを待ち受けさせてから使う" disabled>XMODEM送信...</button>
      <span class="spacer"></span>
      <button type="button" id="open-options">オプション...</button>
    </header>
    <nav id="tabs" role="tablist"></nav>
    <main id="panes">
      <p id="welcome">「新規接続」または Alt+N で接続を開始します。</p>
    </main>
    <footer id="status"></footer>

    <dialog id="login">
      <form id="login-form">
        <h1>新規Telnet/SSH接続</h1>
        <fieldset id="login-fields">
          <div class="fields">
            <label for="login-host">ホスト</label>
            <input id="login-host" required autocomplete="off" spellcheck="false" />
            <label for="login-protocol">プロトコル</label>
            <select id="login-protocol">
              <option value="ssh2">SSH2</option>
            </select>
            <label for="login-port">ポート</label>
            <input id="login-port" type="number" min="1" max="65535" value="22" required />
          </div>
          <fieldset>
            <legend>SSHパラメータ</legend>
            <div class="fields">
              <label for="login-user">アカウント</label>
              <input id="login-user" required autocomplete="off" spellcheck="false" />
              <label for="login-auth">認証方法</label>
              <select id="login-auth">
                <option value="password">パスワード</option>
                <option value="publicKey">公開鍵</option>
              </select>
              <label for="login-passphrase">パスフレーズ</label>
              <input id="login-passphrase" type="password" autocomplete="off" />
              <span></span>
              <label class="check"><input type="checkbox" id="login-remember" />パスワードを一時的に記憶する（終了まで）</label>
              <label for="login-key">鍵ファイル</label>
              <div class="file-row">
                <input id="login-key" autocomplete="off" spellcheck="false" />
                <button type="button" id="login-browse">参照...</button>
              </div>
            </div>
          </fieldset>
          <fieldset>
            <legend>ターミナル</legend>
            <div class="fields">
              <label for="login-term">種類</label>
              <select id="login-term">
                <option>xterm</option>
                <option>xterm-256color</option>
                <option>vt100</option>
                <option>kterm</option>
              </select>
              <label for="login-encoding">エンコーディング</label>
              <select id="login-encoding" class="encodings"></select>
            </div>
          </fieldset>
        </fieldset>
        <p id="login-message" role="status"></p>
        <div class="buttons">
          <button type="submit" id="login-ok">OK</button>
          <button type="button" id="login-cancel">キャンセル</button>
        </div>
      </form>
    </dialog>

    <dialog id="host-key">
      <form method="dialog">
        <h1>SSHホスト鍵の確認</h1>
        <p id="host-key-message"></p>
        <dl>
          <dt>ホスト</dt>
          <dd id="host-key-host"></dd>
          <dt>鍵の種類</dt>
          <dd id="host-key-algorithm"></dd>
          <dt>フィンガープリント</dt>
          <dd id="host-key-fingerprint"></dd>
        </dl>
        <div class="buttons">
          <button value="yes">はい</button>
          <button value="no" id="host-key-no">いいえ</button>
        </div>
      </form>
    </dialog>

    <dialog id="options">
      <form id="options-form">
        <h1>オプション</h1>
        <fieldset>
          <legend>表示</legend>
          <div class="fields">
            <label for="options-font">フォント</label>
            <input id="options-font" list="font-suggestions" required spellcheck="false" />
            <label for="options-size">サイズ (pt)</label>
            <input id="options-size" type="number" min="6" max="48" step="0.5" required />
            <label for="options-opacity">背景の不透明度</label>
            <div class="range-row">
              <input id="options-opacity" type="range" min="30" max="100" step="5" />
              <output id="options-opacity-value" for="options-opacity"></output>
            </div>
          </div>
          <p class="note">カンマ区切りで複数指定でき、前にあるフォントから使われます。</p>
        </fieldset>
        <fieldset>
          <legend>接続</legend>
          <div class="fields">
            <label for="options-encoding">エンコーディング</label>
            <select id="options-encoding" class="encodings"></select>
          </div>
          <p class="note">新規接続の初期値です。</p>
        </fieldset>
        <p id="options-message" role="status"></p>
        <div class="buttons">
          <button type="submit">OK</button>
          <button type="button" id="options-cancel">キャンセル</button>
        </div>
      </form>
    </dialog>
    <datalist id="font-suggestions">
      <option value='"Courier New", "MS Gothic", Menlo, "DejaVu Sans Mono", monospace'></option>
      <option value='"BIZ UDGothic", monospace'></option>
      <option value='"MS Gothic", monospace'></option>
      <option value='Consolas, "MS Gothic", monospace'></option>
      <option value='"Cascadia Mono", "MS Gothic", monospace'></option>
    </datalist>

    <div id="context-menu" role="menu" hidden>
      <button type="button" role="menuitem" id="menu-copy"><span>コピー</span><kbd>Alt+C</kbd></button>
      <button type="button" role="menuitem" id="menu-paste"><span>貼り付け</span><kbd>Alt+V</kbd></button>
    </div>

    <script src="vendor/xterm/xterm.js"></script>
    <script src="vendor/xterm/addon-fit.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
