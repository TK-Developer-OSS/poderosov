<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>PoderosoV</title>
    <link rel="stylesheet" href="vendor/xterm/xterm.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav id="menubar">
      <div class="menu">
        <button type="button" class="menu-title">ファイル</button>
        <div class="menu-items" id="menu-file" hidden>
          <button type="button" data-command="new-connection"><span>新規Telnet/SSH接続...</span><kbd>Alt+N</kbd></button>
          <button type="button" data-command="open-shortcut"><span>ショートカットを開く...</span></button>
          <button type="button" data-command="save-shortcut" data-needs="session"><span>ショートカットを保存...</span></button>
          <hr />
          <div id="menu-file-shortcuts"></div>
          <hr />
          <button type="button" data-command="exit"><span>終了</span></button>
        </div>
      </div>
      <div class="menu">
        <button type="button" class="menu-title">編集</button>
        <div class="menu-items" hidden>
          <button type="button" data-command="copy" data-needs="session"><span>コピー</span><kbd>Alt+C</kbd></button>
          <button type="button" data-command="paste" data-needs="open"><span>貼り付け</span><kbd>Alt+V</kbd></button>
        </div>
      </div>
      <div class="menu">
        <button type="button" class="menu-title">コンソール</button>
        <div class="menu-items" hidden>
          <button type="button" data-command="close-session" data-needs="session"><span>閉じる</span></button>
        </div>
      </div>
      <div class="menu">
        <button type="button" class="menu-title">ツール</button>
        <div class="menu-items" hidden>
          <button type="button" data-command="xmodem" data-needs="open"><span>XMODEM送信...</span></button>
          <hr />
          <button type="button" data-command="options"><span>オプション...</span></button>
        </div>
      </div>
    </nav>
    <header id="toolbar">
      <button type="button" class="tool" data-command="new-connection" title="新規Telnet/SSH接続 (Alt+N)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5" /><path d="M4 6l2 1.5L4 9M7.5 9H10M5 13.5h6" /></svg>
        新規接続
      </button>
      <button type="button" class="tool" data-command="open-shortcut" title="ショートカットを開く">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4.5v8h11l2-6h-11l-2 6M1.5 4.5V3h4l1 1.5h6v2" /></svg>
        開く
      </button>
      <button type="button" class="tool" data-command="save-shortcut" data-needs="session" title="ショートカットを保存">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h9l2 2v9h-11zM5 2.5v3.5h5V2.5M5 13.5v-4h6v4" /></svg>
        保存
      </button>
      <span class="separator"></span>
      <label class="tool-field">改行
        <select id="tool-newline" data-needs="open">
          <option value="CR">CR</option>
          <option value="LF">LF</option>
          <option value="CRLF">CR+LF</option>
        </select>
      </label>
      <label class="tool-field">エンコーディング
        <select id="tool-encoding" class="encodings" data-needs="open"></select>
      </label>
      <span class="separator"></span>
      <button type="button" class="tool" id="xmodem-send" data-command="xmodem" data-needs="open" title="相手側で rx などを待ち受けさせてから使う">XMODEM送信...</button>
      <span class="spacer"></span>
      <button type="button" class="tool" data-command="options">オプション...</button>
    </header>
    <nav id="tabs" role="tablist"></nav>
    <main id="panes">
      <div id="welcome">
        <p>「新規接続」または Alt+N で接続を開始します。</p>
        <p class="credit">PoderosoV — Inspired by Poderosa 4.x</p>
      </div>
    </main>
    <footer id="status"></footer>

    <dialog id="login">
      <form id="login-form">
        <h1>新規Telnet/SSH接続</h1>
        <fieldset id="login-fields">
          <div class="fields">
            <label for="login-history">接続履歴</label>
            <select id="login-history"></select>
            <label for="login-host">ホスト</label>
            <input id="login-host" required autocomplete="off" spellcheck="false" />
            <label for="login-protocol">プロトコル</label>
            <select id="login-protocol">
              <option value="ssh2">SSH2</option>
            </select>
            <label for="login-port">ポート</label>
            <input id="login-port" type="number" min="1" max="65535" value="22" required />
          </div>
          <fieldset>
            <legend>SSHパラメータ</legend>
            <div class="fields">
              <label for="login-user">アカウント</label>
              <input id="login-user" required autocomplete="off" spellcheck="false" />
              <label for="login-auth">認証方法</label>
              <select id="login-auth">
                <option value="password">パスワード</option>
                <option value="publicKey">公開鍵</option>
              </select>
              <label for="login-passphrase">パスフレーズ</label>
              <input id="login-passphrase" type="password" autocomplete="off" />
              <span></span>
              <label class="check"><input type="checkbox" id="login-remember" />パスワードを一時的に記憶する（終了まで）</label>
              <label for="login-key">鍵ファイル</label>
              <div class="file-row">
                <input id="login-key" autocomplete="off" spellcheck="false" />
                <button type="button" id="login-browse">参照...</button>
              </div>
            </div>
          </fieldset>
          <fieldset>
            <legend>ターミナル</legend>
            <div class="fields">
              <label for="login-term">種類</label>
              <select id="login-term">
                <option>xterm</option>
                <option>xterm-256color</option>
                <option>vt100</option>
                <option>kterm</option>
              </select>
              <label for="login-encoding">エンコーディング</label>
              <select id="login-encoding" class="encodings"></select>
              <label for="login-newline">改行</label>
              <select id="login-newline">
                <option value="CR">CR</option>
                <option value="LF">LF</option>
                <option value="CRLF">CR+LF</option>
              </select>
            </div>
          </fieldset>
        </fieldset>
        <p id="login-message" role="status"></p>
        <div class="buttons">
          <button type="submit" id="login-ok">OK</button>
          <button type="button" id="login-cancel">キャンセル</button>
        </div>
      </form>
    </dialog>

    <dialog id="host-key">
      <form method="dialog">
        <h1>SSHホスト鍵の確認</h1>
        <p id="host-key-message"></p>
        <dl>
          <dt>ホスト</dt>
          <dd id="host-key-host"></dd>
          <dt>鍵の種類</dt>
          <dd id="host-key-algorithm"></dd>
          <dt>フィンガープリント</dt>
          <dd id="host-key-fingerprint"></dd>
        </dl>
        <div class="buttons">
          <button value="yes">はい</button>
          <button value="no" id="host-key-no">いいえ</button>
        </div>
      </form>
    </dialog>

    <dialog id="options">
      <form id="options-form">
        <h1>オプション</h1>
        <fieldset>
          <legend>表示</legend>
          <div class="fields">
            <label for="options-font">フォント</label>
            <input id="options-font" list="font-suggestions" required spellcheck="false" />
            <label for="options-size">サイズ (pt)</label>
            <input id="options-size" type="number" min="6" max="48" step="0.5" required />
            <label for="options-foreground">文字色</label>
            <input id="options-foreground" type="color" />
            <label for="options-background">背景色</label>
            <input id="options-background" type="color" />
            <label for="options-opacity">背景の濃さ</label>
            <div class="range-row">
              <input id="options-opacity" type="range" min="30" max="100" step="5" />
              <output id="options-opacity-value" for="options-opacity"></output>
            </div>
          </div>
          <p class="note">カンマ区切りで複数指定でき、前にあるフォントから使われます。</p>
        </fieldset>
        <fieldset>
          <legend>接続</legend>
          <div class="fields">
            <label for="options-encoding">エンコーディング</label>
            <select id="options-encoding" class="encodings"></select>
          </div>
          <p class="note">新規接続の初期値です。</p>
        </fieldset>
        <p id="options-message" role="status"></p>
        <div class="buttons">
          <button type="submit">OK</button>
          <button type="button" id="options-cancel">キャンセル</button>
        </div>
      </form>
    </dialog>
    <datalist id="font-suggestions">
      <option value='"Courier New", "MS Gothic", Menlo, "DejaVu Sans Mono", monospace'></option>
      <option value='"BIZ UDGothic", monospace'></option>
      <option value='"MS Gothic", monospace'></option>
      <option value='Consolas, "MS Gothic", monospace'></option>
      <option value='"Cascadia Mono", "MS Gothic", monospace'></option>
    </datalist>

    <div id="context-menu" role="menu" hidden>
      <button type="button" role="menuitem" id="menu-copy"><span>コピー</span><kbd>Alt+C</kbd></button>
      <button type="button" role="menuitem" id="menu-paste"><span>貼り付け</span><kbd>Alt+V</kbd></button>
    </div>

    <script src="vendor/xterm/xterm.js"></script>
    <script src="vendor/xterm/addon-fit.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
